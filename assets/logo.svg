<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Emblema Ultimate Fan Tracker">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ed1d24"/>
      <stop offset="1" stop-color="#a3151a"/>
    </linearGradient>
    <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#f2c94c" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- esplosione comic dietro lo scudo -->
  <path d="M60 3 L69 17 L85 10 L86 27 L103 27 L96 42 L112 50 L98 60 L112 70 L96 78 L103 93 L86 93 L85 110 L69 103 L60 117 L51 103 L35 110 L34 93 L17 93 L24 78 L8 70 L22 60 L8 50 L24 42 L17 27 L34 27 L35 10 L51 17 Z"
        fill="#f2c94c" opacity="0.9"/>

  <!-- scudo -->
  <path d="M60 16 L96 29 V60 C96 82 79 96 60 103 C41 96 24 82 24 60 V29 Z"
        fill="url(#shieldGrad)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 16 L96 29 V60 C96 82 79 96 60 103 C41 96 24 82 24 60 V29 Z"
        fill="url(#halftone)"/>

  <!-- spunta di completamento: il gesto del "tracker" -->
  <path d="M42 61 L55 74 L80 44"
        fill="none" stroke="#0a0a0f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 61 L55 74 L80 44"
        fill="none" stroke="#f2c94c" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
