name: Deploy to GitHub Pages

# Il sito è statico e vive nella radice del repository: non serve nessuna build,
# si pubblica il contenuto così com'è. Il deploy parte dal ramo di lavoro, che è
# dove sta il sito.
# L'ambiente github-pages accetta deploy solo dal ramo predefinito, quindi il
# sito vive su main: ogni push lì aggiorna il sito pubblicato.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; le esecuzioni in coda vengono sostituite dall'ultima.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages va attivato una volta a mano in Settings → Pages → Source: GitHub Actions.
      # Il token di questo workflow non ha i permessi per crearlo da sé: provarci con
      # enablement:true fallisce con "Resource not accessible by integration", che
      # sembra un problema di permessi del workflow e invece è solo l'impostazione
      # mancante. Meglio non tentare e lasciare un errore comprensibile.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
