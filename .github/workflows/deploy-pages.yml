name: Deploy to GitHub Pages

# Il sito è statico e vive nella radice del repository: non serve nessuna build,
# si pubblica il contenuto così com'è. Il deploy parte dal ramo di lavoro, che è
# dove sta il sito.
on:
  push:
    branches:
      - claude/marvel-mcu-checklist-site-udaes3
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; le esecuzioni in coda vengono sostituite dall'ultima.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement:true attiva Pages al primo giro, senza passare dalle impostazioni
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
