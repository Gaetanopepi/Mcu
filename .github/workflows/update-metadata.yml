name: Update TMDB metadata

on:
  schedule:
    # 04:00 UTC daily — posters/synopses/ratings/episodes rarely change faster than that.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch metadata from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/fetch_tmdb_metadata.py

      - name: Commit updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metadata.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh TMDB metadata"
            git push
          fi
