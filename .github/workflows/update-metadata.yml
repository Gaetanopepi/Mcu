name: Update TMDB metadata

# Automatico, una volta al giorno. Due passaggi:
#   1. si cercano contenuti Marvel appena usciti e si aggiungono al tracker
#      (nuove stagioni di serie già seguite, film e serie nuovi di zecca);
#   2. si riscaricano i metadati di tutti i titoli, nuovi compresi.
# Il risultato viene committato, e il push su main fa ripartire il deploy.
# Nessun passaggio manuale: workflow_dispatch resta solo per forzare un giro.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cerca contenuti appena usciti
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/discover_new_titles.py

      - name: Scarica i metadati da TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/fetch_tmdb_metadata.py

      - name: Committa gli aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metadata.js assets/data.js
          if git diff --staged --quiet; then
            echo "Nessuna modifica: tracker e metadati sono già aggiornati." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: aggiorna tracker e metadati TMDB"
            git push
          fi
