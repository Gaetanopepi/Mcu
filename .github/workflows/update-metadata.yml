name: Update TMDB metadata

# Manuale, non pianificato. I metadati vengono "congelati" dentro
# assets/metadata.js e committati: da quel momento il sito non ha più
# bisogno di TMDB, né di una chiave, per nessuno. Questa Action serve solo
# quando aggiungi titoli al tracker o vuoi rinfrescare i dati di proposito.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch metadata from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/fetch_tmdb_metadata.py

      - name: Commit updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metadata.js
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai metadati." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: aggiorna i metadati TMDB congelati"
            git push
          fi
